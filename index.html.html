<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071b17">
<title>Русский бильярд — браузерная версия</title>
<style>
:root{--gold:#d7b56d;--ink:#071b17;--panel:#102a23}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at top,#17382d,#061510 70%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f4eddd;touch-action:none}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);gap:8px}
header{display:flex;align-items:center;justify-content:space-between;min-height:48px}
.brand{font-weight:800;letter-spacing:.11em;font-size:13px;color:var(--gold)}
.sub{font-size:11px;color:#b8c9bf;margin-top:2px}
.pill{border:1px solid #806a42;border-radius:20px;padding:7px 10px;font-size:11px;color:#f0d99e;background:#15281f}
#tableWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
canvas{display:block;width:100%;height:100%;max-height:100%;border-radius:14px;touch-action:none}
#bottom{background:linear-gradient(145deg,#17352b,#0b201a);border:1px solid #315346;border-radius:16px;padding:11px 12px 12px;box-shadow:0 12px 35px #0006}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
select,button{font:inherit;color:#f5ead1;background:#203d31;border:1px solid #597361;border-radius:10px;padding:9px 11px}
select{min-width:0;flex:1;font-size:13px}
button{font-weight:700}
button:active{transform:scale(.98)}
#power{width:100%;accent-color:var(--gold);margin:11px 0 4px}
.hint{font-size:11px;color:#b8c9bf;line-height:1.35;margin-top:6px}
#status{font-size:12px;color:#f0d99e;white-space:nowrap}
@media (orientation:landscape){header{min-height:38px}#bottom{padding:8px 12px}.hint{display:none}#power{margin:6px 0 0}}
</style>
</head>
<body>
<div id="app">
<header>
 <div><div class="brand">RUSSIAN BILLIARDS</div><div class="sub">Обновлённая версия для iPhone · одиночная игра</div></div>
 <div class="pill" id="score">Забито: 0</div>
</header>
<div id="tableWrap"><canvas id="game"></canvas></div>
<section id="bottom">
 <div class="row">
  <select id="mode" aria-label="Режим игры">
   <option value="free">Свободная пирамида</option>
   <option value="moscow">Московская пирамида</option>
   <option value="combined">Комбинированная пирамида</option>
  </select>
  <button id="reset">Новая партия</button>
 </div>
 <input id="power" type="range" min="10" max="100" value="55" aria-label="Сила удара">
 <div class="row"><span class="hint">Потяни от белого шара назад и отпусти, чтобы ударить.</span><span id="status">Готов к удару</span></div>
</section>
</div>
<script>
(() => {
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
const wrap=document.getElementById('tableWrap'), power=document.getElementById('power');
const scoreEl=document.getElementById('score'), statusEl=document.getElementById('status');
const modeEl=document.getElementById('mode');
let W=0,H=0,dpr=1,balls=[],aim=null,potted=0,dragging=false, last=0;
const R=12, friction=.986, railBounce=.82;
const table={x:0,y:0,w:0,h:0};
function resize(){
 const rect=wrap.getBoundingClientRect(); dpr=Math.min(window.devicePixelRatio||1,2);
 W=Math.max(240,rect.width); H=Math.max(180,rect.height);
 canvas.width=Math.max(1,Math.floor(W*dpr));canvas.height=Math.max(1,Math.floor(H*dpr));
 ctx.setTransform(dpr,0,0,dpr,0,0);
 const aspect=2.02, margin=Math.min(30,W*.07);
 let tw=Math.min(W-margin*2,(H-28)*aspect); let th=tw/aspect;
 if(th>H-24){th=H-24;tw=th*aspect}
 table.w=tw;table.h=th;table.x=(W-tw)/2;table.y=(H-th)/2;
 draw();
}
function reset(){
 balls=[];potted=0;scoreEl.textContent='Забито: 0';statusEl.textContent='Готов к удару';
 const cx=table.x+table.w/2, y=table.y+table.h;
 balls.push({x:cx,y:y-table.h*.25,vx:0,vy:0,cue:true});
 // 15 ivory object balls in a tight pyramid at the far end
 const spacing=R*2.03, baseY=table.y+table.h*.30;
 for(let row=0;row<5;row++) for(let col=0;col<=row;col++){
   balls.push({x:cx+(col-row/2)*spacing,y:baseY+row*R*1.78,vx:0,vy:0,cue:false});
 }
 draw();
}
function roundedRect(x,y,w,h,r){
 ctx.beginPath();
 // Совместимо со старыми версиями Safari на iPhone (без Canvas roundRect).
 r=Math.max(0,Math.min(r,w/2,h/2));
 ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
 ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
 ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
 ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function draw(){
 if(!W||!H)return;
 ctx.clearRect(0,0,W,H);
 // soft shadow and polished wooden frame
 ctx.save();ctx.shadowColor='#000a';ctx.shadowBlur=20;ctx.shadowOffsetY=8;
 roundedRect(table.x-17,table.y-17,table.w+34,table.h+34,18);ctx.fillStyle='#432617';ctx.fill();ctx.restore();
 const wood=ctx.createLinearGradient(table.x,table.y,table.x+table.w,table.y+table.h);
 wood.addColorStop(0,'#81502c');wood.addColorStop(.5,'#4d2b19');wood.addColorStop(1,'#9a6334');
 roundedRect(table.x-12,table.y-12,table.w+24,table.h+24,13);ctx.fillStyle=wood;ctx.fill();
 roundedRect(table.x-4,table.y-4,table.w+8,table.h+8,8);ctx.fillStyle='#153d2d';ctx.fill();
 roundedRect(table.x,table.y,table.w,table.h,5);ctx.fillStyle='#176044';ctx.fill();
 // cloth subtle shading
 const cloth=ctx.createLinearGradient(0,table.y,0,table.y+table.h);
 cloth.addColorStop(0,'#1b7653');cloth.addColorStop(1,'#0e4b38');
 roundedRect(table.x+3,table.y+3,table.w-6,table.h-6,3);ctx.fillStyle=cloth;ctx.fill();
 // pocket openings
 const pockets=getPockets();
 pockets.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y, R*1.65,0,Math.PI*2);ctx.fillStyle='#030806';ctx.fill();ctx.strokeStyle='#a47743';ctx.lineWidth=2;ctx.stroke()});
 // table markings
 ctx.strokeStyle='#d6c59a55';ctx.lineWidth=1;ctx.beginPath();
 ctx.moveTo(table.x+table.w*.12,table.y+table.h*.75);ctx.lineTo(table.x+table.w*.88,table.y+table.h*.75);ctx.stroke();
 // balls
 balls.forEach(b=>{
  ctx.save();ctx.shadowColor='#00150eaa';ctx.shadowBlur=5;ctx.shadowOffsetY=3;
  const g=ctx.createRadialGradient(b.x-R*.35,b.y-R*.4,1,b.x,b.y,R*1.2);
  if(b.cue){g.addColorStop(0,'#fff');g.addColorStop(.7,'#e9e6dc');g.addColorStop(1,'#aaa99f')}
  else {g.addColorStop(0,'#fffef3');g.addColorStop(.75,'#e9e3d2');g.addColorStop(1,'#aaa28f')}
  ctx.beginPath();ctx.arc(b.x,b.y,R,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  ctx.restore();
 });
 if(aim && balls[0]){
  const b=balls[0],dx=aim.x,dy=aim.y;
  ctx.save();ctx.setLineDash([5,5]);ctx.strokeStyle='#fff2c6';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+dx*125,b.y+dy*125);ctx.stroke();ctx.restore();
  // stylized cue behind cue ball
  ctx.strokeStyle='#d6a65c';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(b.x-dx*26-dy*0,b.y-dy*26+dx*0);ctx.lineTo(b.x-dx*90,b.y-dy*90);ctx.stroke();
 }
}
function getPockets(){const x=table.x,y=table.y,w=table.w,h=table.h;return [{x,y},{x:x+w/2,y},{x:x+w,y},{x,y:y+h},{x:x+w/2,y:y+h},{x:x+w,y:y+h}]}
function pointer(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function nearestCue(p){const b=balls.find(x=>x.cue);return b&&Math.hypot(p.x-b.x,p.y-b.y)<R*4.5?b:null}
canvas.addEventListener('pointerdown',e=>{
 if(balls.some(b=>Math.hypot(b.vx,b.vy)>.12))return;
 const p=pointer(e), cue=nearestCue(p);if(!cue)return;
 dragging=true;canvas.setPointerCapture(e.pointerId);aim={x:0,y:0};statusEl.textContent='Прицеливание';
});
canvas.addEventListener('pointermove',e=>{
 if(!dragging)return;const p=pointer(e),b=balls[0];let dx=b.x-p.x,dy=b.y-p.y,len=Math.hypot(dx,dy)||1;
 aim={x:dx/len,y:dy/len};draw();
});
canvas.addEventListener('pointerup',e=>{
 if(!dragging)return;dragging=false;
 const p=pointer(e),b=balls[0];let dx=b.x-p.x,dy=b.y-p.y,len=Math.hypot(dx,dy);
 if(len>4){const force=Number(power.value)/100*7.8;b.vx=dx/len*force;b.vy=dy/len*force;statusEl.textContent='Шары катятся…'}
 aim=null;draw();
});
function step(dt){
 const factor=Math.min(dt/16.67,2);
 for(const b of balls){
  b.x+=b.vx*factor;b.y+=b.vy*factor;
  b.vx*=Math.pow(friction,factor);b.vy*=Math.pow(friction,factor);
  if(Math.hypot(b.vx,b.vy)<.025)b.vx=b.vy=0;
  // cushion boundaries
  const left=table.x+R, right=table.x+table.w-R, top=table.y+R,bottom=table.y+table.h-R;
  if(b.x<left){b.x=left;b.vx=Math.abs(b.vx)*railBounce}
  if(b.x>right){b.x=right;b.vx=-Math.abs(b.vx)*railBounce}
  if(b.y<top){b.y=top;b.vy=Math.abs(b.vy)*railBounce}
  if(b.y>bottom){b.y=bottom;b.vy=-Math.abs(b.vy)*railBounce}
 }
 // circle-circle collision resolution
 for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){
  const a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=R*2;
  if(d>0&&d<min){
   const nx=dx/d,ny=dy/d,overlap=min-d;
   a.x-=nx*overlap*.5;a.y-=ny*overlap*.5;b.x+=nx*overlap*.5;b.y+=ny*overlap*.5;
   const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
   if(rel<0){const impulse=-(1+.94)*rel/2;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny}
  }
 }
 // pockets: object balls disappear; cue ball is respotted
 const pockets=getPockets();
 for(let i=balls.length-1;i>=0;i--){
  const b=balls[i],pocket=pockets.some(p=>Math.hypot(b.x-p.x,b.y-p.y)<R*1.55);
  if(pocket){
   if(b.cue){b.x=table.x+table.w/2;b.y=table.y+table.h*.75;b.vx=b.vy=0}
   else {balls.splice(i,1);potted++;scoreEl.textContent='Забито: '+potted}
  }
 }
}
function loop(t){const dt=last?Math.min(t-last,34):16;last=t;step(dt);draw();if(!dragging&&!balls.some(b=>Math.hypot(b.vx,b.vy)>.04))statusEl.textContent='Готов к удару';requestAnimationFrame(loop)}
document.getElementById('reset').addEventListener('click',reset);
modeEl.addEventListener('change',()=>{statusEl.textContent='Режим: '+modeEl.options[modeEl.selectedIndex].text+' · демонстрационный';});
window.addEventListener('resize',()=>{const oldW=table.w,oldH=table.h;resize();if(oldW&&oldH&&balls.length){const sx=table.w/oldW,sy=table.h/oldH;balls.forEach(b=>{b.x=table.x+(b.x-(table.x))*sx;b.y=table.y+(b.y-table.y)*sy})}});
resize();reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
